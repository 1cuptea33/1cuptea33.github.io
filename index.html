<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>মুহাসাবা — দৈনিক আমল ট্র্যাকার</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0E2A20;
    --bg-deep-2:#123626;
    --paper:#FBF6EA;
    --paper-2:#F3ECDA;
    --gold:#C79A3D;
    --gold-soft:#E3C888;
    --ink:#1E2621;
    --muted:#6E7A70;
    --muted-2:#9AA79C;
    --check:#2F6B4F;
    --line:#E3DAC3;
    --shadow:0 2px 10px rgba(14,42,32,0.08);
  }
  body.dark{
  --paper:#14201A; --paper-2:#1B2A22; --ink:#EDE7D6; --muted:#8CA093;
  --line:#2C3D33; --bg-deep:#0A1712; --bg-deep-2:#0E2018;
}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif Bengali', serif;}

  /* Header */
  header{
    background:linear-gradient(180deg, var(--bg-deep), var(--bg-deep-2));
    color:var(--paper);
    padding:18px 16px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .crescent{
    width:26px;height:26px; position:relative; flex-shrink:0;
  }
  .crescent::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:var(--gold-soft);
    box-shadow: 7px 1px 0 -2px var(--bg-deep) inset;
  }
  .brand-text h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;}
  .brand-text p{margin:1px 0 0; font-size:11.5px; color:var(--gold-soft); font-weight:500;}

  .datebar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .date-nav{display:flex; align-items:center; gap:6px;}
  .navbtn{
    width:34px;height:34px; border-radius:50%; border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06); color:var(--paper); font-size:16px;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .navbtn:active{background:rgba(255,255,255,0.16);}
  .date-label{text-align:center; min-width:150px;}
  .date-label .d1{font-size:14.5px; font-weight:600;}
  .date-label .d2{font-size:11px; color:var(--muted-2); margin-top:1px;}
  .date-label .d3{font-size:11px; color:var(--gold-soft); margin-top:2px; direction:rtl;}
  .todaybtn{
    font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--gold);
    color:var(--gold-soft); background:transparent; cursor:pointer;
  }

  .ring-wrap{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--gold-soft); font-family:'Noto Serif Bengali',serif;
  }

  /* Tabs */
  .tabs{
    display:flex; gap:6px; padding:10px 12px 0; background:var(--paper);
    position:sticky; top:96px; z-index:19; border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1; text-align:center; padding:10px 4px 12px; font-size:13.5px; font-weight:600;
    color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; position:relative;
  }
  .tab.active{color:var(--bg-deep); border-bottom-color:var(--gold);}
  .tab .badge{
    display:block; font-size:10.5px; font-weight:500; color:var(--muted-2); margin-top:2px;
  }
  .tab.active .badge{color:var(--gold-dark, #9C7526);}

  main{padding:14px 12px 10px; max-width:640px; margin:0 auto;}

  .category{
    background:var(--paper-2); border:1px solid var(--line); border-radius:14px;
    margin-bottom:12px; overflow:hidden;
  }
  .cat-head{
    display:flex; align-items:center; justify-content:space-between; padding:13px 14px;
    cursor:pointer; user-select:none;
  }
  .cat-head h3{margin:0; font-size:15px; font-weight:600; color:var(--bg-deep);}
  .cat-meta{display:flex; align-items:center; gap:8px;}
  .cat-count{font-size:11.5px; color:var(--muted); font-weight:600;}
  .chev{transition:transform .2s ease; color:var(--muted); font-size:12px;}
  .category.open .chev{transform:rotate(180deg);}
  .cat-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
  }
  .category.open .cat-body{max-height:4000px;}
  .cat-inner{padding:0 12px 10px;}

  .item{
    display:flex; align-items:flex-start; gap:10px; padding:9px 4px;
    border-top:1px solid var(--line);
  }
  .cat-inner .item:first-child{border-top:none;}
  .chk{
    width:21px;height:21px; border-radius:6px; border:2px solid var(--muted-2);
    flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background:#fff; transition:.15s;
  }
  .chk.on{background:var(--check); border-color:var(--check);}
  .chk.on::after{content:"✓"; color:#fff; font-size:13px; font-weight:700;}
  .item-text{flex:1;}
  .item-q{font-size:14px; line-height:1.55; cursor:pointer;}
  .item.done .item-q{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted-2);}
  .item-detail{
    font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:5px;
    background:#fff; border-left:2px solid var(--gold); padding:7px 9px; border-radius:6px;
    display:none;
  }
  .item-detail.show{display:block;}
  .detail-toggle{
    font-size:11px; color:var(--gold-dark,#9C7526); margin-top:3px; cursor:pointer; display:inline-block;
  }

  .notes-box{
    background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:4px;
  }
  .notes-box h3{margin:0 0 8px; font-size:14.5px; color:var(--bg-deep);}
  textarea{
    width:100%; min-height:80px; border:1px solid var(--line); border-radius:10px; padding:10px;
    font-family:'Hind Siliguri', sans-serif; font-size:13.5px; resize:vertical; background:#fff; color:var(--ink);
  }
  textarea:focus{outline:1.5px solid var(--gold);}

  .savebar{
    position:fixed; bottom:0; left:0; right:0; background:var(--paper);
    border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:25;
  }
  .save-status{font-size:12px; color:var(--muted);}
  .save-status.ok{color:var(--check);}
  .expand-all{
    font-size:12px; color:var(--bg-deep); background:#fff; border:1px solid var(--line);
    padding:8px 12px; border-radius:20px; cursor:pointer; font-weight:600;
  }

  .loading{padding:40px 10px; text-align:center; color:var(--muted); font-size:13px;}
  ::selection{background:var(--gold-soft);}
  .report-btn{
  font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--gold);
  color:var(--gold-soft); background:transparent; cursor:pointer; margin-left:6px;
}
.modal-overlay{
  position:fixed; inset:0; background:rgba(14,42,32,0.65); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--paper); width:100%; max-width:640px; max-height:85vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:16px 16px 24px;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.modal-head h2{margin:0; font-size:17px; color:var(--bg-deep);}
.modal-close{font-size:20px; color:var(--muted); cursor:pointer; padding:4px 8px;}
.range-buttons{display:flex; gap:8px; margin-bottom:16px;}
.range-btn{
  flex:1; text-align:center; padding:9px; border-radius:10px; border:1.5px solid var(--line);
  background:#fff; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
}
.range-btn.active{border-color:var(--gold); color:var(--bg-deep); background:var(--paper-2);}
.report-summary{
  background:var(--paper-2); border-radius:14px; padding:14px; margin-bottom:14px; text-align:center;
}
.report-summary .big{font-size:32px; font-weight:700; color:var(--bg-deep); font-family:'Noto Serif Bengali',serif;}
.report-summary .small{font-size:12px; color:var(--muted); margin-top:2px;}
.report-cat-row{
  display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--line);
}
.report-cat-row .name{flex:1; font-size:13px; color:var(--ink);}
.report-cat-row .pct{font-size:13px; font-weight:700; width:44px; text-align:right;}
.bar-track{flex:2; height:7px; background:var(--line); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; border-radius:5px; background:var(--check);}
</style>
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="crescent"></div>
    <div class="brand-text">
      <h1>মুহাসাবা</h1>
      <p id="streakText" style="margin-top:2px;"></p>
    </div>
  </div>
  <div class="datebar">
    <div class="date-nav">
      <div class="navbtn" id="prevDay">‹</div>
      <div class="date-label">
        <div class="d1" id="dateD1">—</div>
        <div class="d2" id="dateD2">—</div>
        <div class="d3" id="dateD3">—</div>
      </div>
      <div class="navbtn" id="nextDay">›</div>
    </div>
    <button class="todaybtn" id="todayBtn">আজ</button>
    <button class="report-btn" id="reportBtn">রিপোর্ট</button>
    <button class="todaybtn" id="darkBtn">🌙</button>
    <div class="ring-wrap">
      <svg width="52" height="52">
        <circle cx="26" cy="26" r="22" stroke="rgba(255,255,255,0.15)" stroke-width="5" fill="none"/>
        <circle id="ringFg" cx="26" cy="26" r="22" stroke="#C79A3D" stroke-width="5" fill="none"
          stroke-dasharray="138.2" stroke-dashoffset="138.2" stroke-linecap="round"/>
      </svg>
      <div class="ring-pct" id="ringPct">০%</div>
    </div>
  </div>
</header>
  </header>

<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>রিপোর্ট</h2>
      <div class="modal-close" id="closeReport">✕</div>
    </div>
    <div class="range-buttons">
      <div class="range-btn" data-days="7">৭ দিন</div>
      <div class="range-btn" data-days="30">১ মাস</div>
      <div class="range-btn" data-days="90">৩ মাস</div>
    </div>
    <div id="reportContent"></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<main id="main">
  <div class="loading">লোড হচ্ছে…</div>
</main>

<div class="savebar">
  <div class="save-status" id="saveStatus">প্রস্তুত</div>
  <div class="expand-all" id="exportBtn" style="margin-right:6px;">এক্সপোর্ট</div>
  <div class="expand-all" id="expandAll">সব খুলুন</div>
</div>

<script>
// ---------- Data ----------
const DATA = {
  daily: {
    label: "দৈনিক",
    categories: [
      { id:"de", title:"বাহ্যিক আমল", items:[
        {id:"de1", q:"অর্থ বুঝে কুরআন তিলাওয়াত (কমপক্ষে আধা পারা)"},
        {id:"de2", q:"আযানের উত্তর ও আযানের পরের দোয়া"},
        {id:"de3", q:"ফজরের নামায (জামাতে / আউয়াল ওয়াক্তে)"},
        {id:"de4", q:"যোহরের নামায"},
        {id:"de5", q:"আসরের নামায"},
        {id:"de6", q:"মাগরিবের নামায"},
        {id:"de7", q:"ইশার নামায"},
        {id:"de8", q:"সুন্নাহ — ২ রাকাত ফজরের পূর্বে"},
        {id:"de9", q:"সুন্নাহ — ৪ রাকাত যোহরের পূর্বে"},
        {id:"de10", q:"সুন্নাহ — ২ রাকাত যোহরের পর"},
        {id:"de11", q:"সুন্নাহ — ২ রাকাত মাগরিবের পর"},
        {id:"de12", q:"সুন্নাহ — ২ রাকাত ইশার পর"},
        {id:"de13", q:"বিতরের নামায"},
        {id:"de14", q:"চাশতের নামায (২ রাকাত)"},
        {id:"de15", q:"সকালের আযকার"},
        {id:"de16", q:"সন্ধ্যার আযকার"},
        {id:"de17", q:"পাঁচ ওয়াক্ত ফরয নামায পরবর্তী আযকার"},
        {id:"de18", q:"মিসওয়াক ব্যবহার"},
        {id:"de19", q:"হাত তুলে দোয়া (কমপক্ষে ১০ মিনিট)"},
        {id:"de20", q:"তাহাজ্জুদের নামায"},
        {id:"de21", q:"অন্যান্য নফল নামায"},
        {id:"de22", q:"ব্যায়াম"},
        {id:"de23", q:"ঘুমের আগে সূরা আস-সাজদা ও সূরা মুলক তিলাওয়াত"},
      ]},
      { id:"ds", title:"আত্মিক মুহাসাবা", items:[
        {id:"ds1", q:"আমার নফসের তাযকিয়া-আত্মশুদ্ধি এবং নিজের সকল দূর্বলতা দূর করে দেয়ার জন্য আমি কি আল্লাহর কাছে সাহায্য কামনা করেছি?",
          detail:"اللَّهُمَّ لا سَهْلَ إِلا مَا جَعَلْتَهُ سَهْلا، وَأَنْتَ تَجْعَلُ الْحَزْنَ سَهْلا إِذَا شِئْتَ — হে আল্লাহ! আপনি যা সহজ করে দেন তা ছাড়া কোনও কিছুই সহজ নয়। আপনি ইচ্ছা করলে কঠিন কাজকেও সহজ করে দিতে পারেন। এ দোয়াটি কি বারবার পড়া হয়েছে? আল্লাহর সাহায্য ছাড়া নিজের শক্তিতে আমরা কিছুই করতে পারবো না।"},
        {id:"ds2", q:"আমি কি আমার দ্বীনি-দুনিয়াবী সকল বিষয়ে (ব্যক্তিগত, পারিবারিক ও তানজিমের বিভিন্ন কাজ-প্রজেক্ট, আর্থিক বিষয় এমনকি নিজের নফসের তাযকিয়াসহ সকল বিষয়ে) নিজেকে অক্ষম এবং সম্পূর্ণরূপে আল্লাহর মুখাপেক্ষী মনে করেছি?"},
        {id:"ds3", q:"আমি কি নফস ও শয়তানের অনিষ্ট থেকে মহান আল্লাহর কাছে বেশি বেশি আশ্রয় কামনা করেছি? কারণ,আল্লাহর অনুগ্রহে নফস ও শয়তানের অনিষ্ট থেকে নিরাপদ থাকতে পারলে, নফসের তাযকিয়া অনেকটাই সহজ হয়ে যাবে ইনশাআল্লাহ",
          detail:"আউযুবিল্লাহি মিনাশ শাইতানির রাজিম, আল্লাহুম্মা ইন্নি আউযুবিকা মিন শাররি নাফসি।"},
        {id:"ds4", q:"আমি কি অসৎ চরিত্র, বদ আমল ও কুপ্রবৃত্তি থেকে আল্লাহর কাছে আশ্রয় কামনা করেছি?",
          detail:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ وَالْأَعْمَالِ وَالْأَهْوَاءِ — হে আল্লাহ! আমি আপনার কাছে অসৎ চরিত্র, বদ আমল ও কুপ্রবৃত্তি থেকে আশ্রয় কামনা করি।"},
        {id:"ds5", q:"কারো উপর রাগ বা অভিমান থাকলে তাকে সহ সকল মুমিনকে ক্ষমাসুন্দর দৃষ্টিতে স্মরণ করে, তাদের সবার কল্যাণের জন্য দোয়া করেছি তো?"},
        {id:"ds6", q:"আমি সম্মুখ ময়দানের মুজাহিদিনের জন্য দোয়া করেছি তো? আমার মজলুম-বন্দি ও শহীদ ভাই-বোনদের জন্য দোয়া করেছি তো? নিজ আনসার ভাইয়ের জন্য (এটি শুধু হাইডআউটে থাকা ভাইদের জন্য) এবং নিজের মা-বাবা ও সন্তানদের জন্য দোয়া করেছি তো? "},
        {id:"ds7", q:"আমি কি মৃত্যুর কথা স্মরণ করেছি? মৃত্যুকে আমি ঘৃণা করি? না, পছন্দ করি? আমি কি ফেরেশতাদের সঙ্গে সাক্ষাতের জন্য প্রস্তুত? আমি কি আমার মৃত আত্মীয়-স্বজনের সঙ্গে সাক্ষাতের জন্য প্রস্তুত? আমি কি কবরের জীবনের জন্য প্রস্তুত? যদি জানতাম, সাত দিন পরে মারা যাব, তাহলে এই সাত দিনে কী কী আমল করতাম? আলাদা কিছু সময় নিয়ে এ বিষয়গুলো ভেবেছি কি?"},

        {id:"ds10", q:"আমি কি আমার সকল আমলে আল্লাহ আমাকে দেখছেন বা আমি আল্লাহকে দেখছি, এ গুণের (ইহসানের গুণের) অভাব পূরণের ফিকির করেছি? (إحسان) এ গুণ অর্জনের উপায় এবং নামাযে খুশু-খুজু লাভের উপায় সম্পর্কে কোনো বই বা প্রবন্ধ কি আমি পড়েছি? এই গুন অর্জনের জন্য আল্লাহর কাছে দোয়া করেছি কি?"},
        {id:"ds11", q:"আমি কি সকল বিষয়ে সত্য বলা, মিথ্যা ও অতিরঞ্জন থেকে বেঁচে থাকা এবং কম কথা বলার চেষ্টা করেছি?"},
        {id:"ds12", q:"এক বা একাধিক এমন কোনো গোপন নেক আমল (الخبيئة الصالحة) কি আমি করেছি যা সম্পর্কে একমাত্র আল্লাহ ছাড়া অন্য কেউ জানে না, যার ওসিলায় আমি দুনিয়া ও আখেরাতের বিপদ-আপদ থেকে নাজাতের আশা করতে পারি?"},
        {id:"ds13", q:"আমি কি মসজিদে গিয়ে জামাতের সাথে নামায আদায় করেছি অথবা (বিশেষ কারণে যেমন, বিভিন্ন দাওরা বা মাশওয়ারার সময় কিংবা কোনো হাইড আউট ভাইয়ের জন্য এটি সম্ভব না হলে অন্তত) আযানের আগেই প্রস্তুতি নিয়ে আযানের সাথে সাথে আউয়াল ওয়াক্তে নামায আদায় করেছি?"},

        {id:"ds15", q:"বাইরে চলাফেরা করার সময় এবং ইন্টারনেটে কাজ করার সময় আমি নিজের নজরকে সব ধরনের খেয়ানত থেকে হেফাযত করেছি তো? নেটে অশ্লীল বিজ্ঞাপন বন্ধ করার জন্য পর্যাপ্ত ব্যবস্থা নিয়েছি তো? "},
        {id:"ds16", q:"এমন কোনো গোপন গুনাহ (ذنوب الخلوات) কি আমার থেকে হয়েছে যা সম্পর্কে একমাত্র আল্লাহ ছাড়া অন্য কেউ জানে না? হয়ে থাকলে আমি কি তা থেকে তাওবা করে তার বিপরীতে একাধিক গোপন নেক আমল (الخبيئة الصالحة) করে নিয়েছি?"},

        {id:"s1a3", q:"আমি কি অন্যদের কাছ থেকে সম্মান পেতে চাই? কারো কথায় আদবের একটু খেলাফ হলে আমার মধ্যে কি রাগ চলে আসে? (এটি অন্তরে অহংকার থাকার লক্ষণ)"},
        {id:"s1a4", q:"আমি কি আমার পরিবার, মামুর, মাসউল বা অন্যান্য মুসলমানদের সাথে কঠোরভাবে কথা বলি? (এটি অহংকারের লক্ষণ) আমি কি সকল পরিস্থিতিতে সবার সাথে নম্র আচরণ করি?"},

        {id:"s1a6", q:"আমি কি কোনো মুসলিমকে, বিশেষভাবে কোনো দ্বীনি ভাইকে অবজ্ঞা করি? (এটি অহংকারের লক্ষণ) ফিতনার এই যুগে জিহাদে শরীক প্রতিটি ভাই একেকটি সম্পদ, কোনো ভাইকে ছোট মনে করা মস্তবড় অন্যায়।"},

        {id:"s1a8", q:"অহংকার আল্লাহর চাদর। একমাত্র তিনিই শ্রেষ্ঠ, আমি তো হলাম মিসকিন। কবরে আমি পঁচে গলে শেষ হয়ে যাবো। দুনিয়ার এই অর্থ-সম্পদ, বংশীয় মর্যাদা, সৌন্দর্য্য, নেতৃত্ব ও ক্ষমতা, কোনো কিছুই থাকবে না। একথাগুলো কি আমি স্মরণ করেছি?"},
        {id:"s1a9", q:"আমার মধ্যে অহংকার থাকলে, আমি কি এর চিকিৎসা নিয়েছি? এর জন্য কি প্রয়োজনে কোনো হক্কানী আলেমের স্মরণাপন্ন হয়েছি?"},
        {id:"s1a10", q:"আমি কি নিজেকে নির্ভুল বা পারফ্যাক্ট (সকল বিষয়ে একশ তে একশ) মনে করি? ছোট বড় সবার কাছ থেকে উপদেশ নেওয়ার জন্য আমি তৈরি আছি তো? কারো থেকে উপদেশ নিতে কোনো ধরনের অনিহা নিই তো? (مظاهر الكبر) (অহংকারের নিদর্শন)"},

      { id:"s1l", title:"১মঃ আল্লাহর প্রতি মহব্বত", items:[
        {id:"s1l1", q:"আল্লাহর প্রতি ভালোবাসা বাড়ানোর দোয়াটি পড়েছি তো?",
          detail:"اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ وَحُبَّ مَنْ يُحِبُّكَ وَالْعَمَلَ الَّذِي يُبَلِّغُنِي حُبَّكَ، اللَّهُمَّ اجْعَلْ حُبَّكَ أَحَبَّ إِلَيَّ مِنْ نَفْسِي وَأَهْلِي وَمِنَ الْمَاءِ الْبَارِدِ - হে আল্লাহ! আমি আপনার কাছে আপনার ভালোবাসা এবং আপনাকে ভালোবাসেন এমন ব্যক্তিদের ভালোবাসা কামনা করি এবং এমন আমলের তাওফীক কামনা করি যার মাধ্যমে আমি আপনার ভালোবাসা লাভ করতে পারবো। হে আল্লাহ! আমার কাছে আপনার ভালোবাসাকে আমার নিজের স্বত্বা, আমার পরিবার পরিজন ও (প্রচন্ড পিপাসার সময়) ঠাণ্ডা পানির ভালোবাসা থেকেও অধিক প্রবল করে দিন"},
        {id:"s1l2", q:"আমি কি আল্লাহর নাম ও গুণাবলীর তালিকা থেকে কিছু নাম ও গুণাবলীর ব্যাপারে চিন্তা-ভাবনা করেছি এবং এর উসিলা দিয়ে দোয়া করেছি? (মানুষ নিজের চেনা-জানা কাউকেই ভালোবাসে, অপরিচিত কাউকে ভালোবাসে না। তাই মহান রবের নাম ও গুণাবলীসমূহ বিস্তারিত জানা জরুরি।) "},
        {id:"s1l3", q:"আল্লাহ আমাকে যত আ'ম নেয়ামত (সুস্থতা, চোখ, কান, নাক, হাত, পা) এবং খাছ নেয়ামত (জিহাদের বুঝ ইত্যাদি) দান করেছেন সেসবের কথা কি আমার স্মরণ করেছি? (এসকল নেয়ামতের কারণে আল্লাহকে কত মহব্বত করা দরকার?)"},
        {id:"s1l4", q:"দুনিয়ার ভালো ও কল্যাণকর সব কিছু কে সৃষ্টি করেছেন- এ কথা কি আমি চিন্তা করেছি? (নিঃসন্দেহে আল্লাহই সৃষ্টি করেছেন তাহলে তাঁকে কত মহব্বত করা দরকার?)"},
        {id:"s1l5", q:"আমার মা-বাবা, নেককার মুসলমান, বিভিন্ন যুগের ইমামগণ এবং মুজাহিদ ওলামা-মাশায়েখ, সবাইকে আমি অন্তর থেকে ভালোবাসি। তাঁদেরকে এসব যোগ্যতা কে দিয়েছেন? কে তাদেরকে নেককার বানিয়েছেন? এ কথা কি আমি চিন্তা করেছি? (নিঃসন্দেহে আল্লাহ। তাহলে সেই রবকে কী পরিমাণ মহব্বত করা দরকার?)"},

        {id:"wl3", q:"প্রয়োজনে আমি কি আমার খাদ্যাভ্যাস পরিবর্তন করেছি? (যেমন, ভাত কম খেয়ে রুটি বেশি খাওয়া ইত্যাদি) আমি কি পরিমিত ঘুমানোর চেষ্টা করেছি?"},
        {id:"wl4", q:"কম ঘুম ও কম খাবার দ্বারাই যেন আমার প্রয়োজন মিটে যায়, এর জন্য আমি কি আল্লাহর কাছে দোয়া করেছি?"},
        {id:"wl5", q:"আমি প্রতিদিন যথানিয়মে ব্যায়াম করি তো? (কারণ, ব্যায়াম না করলে শরীরে অলসতা এসে যায়।)"},
        {id:"wl6", q:"আমি দীর্ঘ সময় ধরে কম্পিউটারে কাজ করলে কিছুক্ষণ পর পর দুই-তিন মিনিট বিরতি দেয়া, একটু হাঁটা চলা করা, হালকা ব্যায়াম করা বা উঠ-বস করা, এসব করি তো? (যেন এক টানা কাজ করতে করতে শরীরে অলসতা না এসে যায়।)"},
      ]},
    ]
  }
};

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function toBn(n){ return String(n).split("").map(c => /\d/.test(c) ? BN_DIGITS[c] : c).join(""); }
const WEEKDAYS = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function keyFor(d){ return "muhasaba:"+fmtDate(d); }

let currentDate = new Date();
let currentTab = "daily";
let dayState = { checked:{}, note:"" };
let openCats = {}; // category open state, persists across tab switches within session

function tabOrder(){ return ["daily","alt","weekly"]; }

async function loadDay(d){
  const status = document.getElementById("saveStatus");
  try{
    const raw = localStorage.getItem(keyFor(d));
    dayState = raw ? JSON.parse(raw) : { checked:{}, note:"" };
  }catch(e){
    dayState = { checked:{}, note:"" };
  }
  status.textContent = "প্রস্তুত"; status.className="save-status";
}

let saveTimer=null;
function scheduleSave(){
  const status = document.getElementById("saveStatus");
  status.textContent = "সেভ হচ্ছে…"; status.className="save-status";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(keyFor(currentDate), JSON.stringify(dayState));
      status.textContent = "সেভ হয়েছে ✓"; status.className="save-status ok";
    }catch(e){
      status.textContent = "সেভ ব্যর্থ হয়েছে"; status.className="save-status";
    }
  }, 300);
}

function renderDateBar(){
  const d = currentDate;
  document.getElementById("dateD1").textContent = WEEKDAYS[d.getDay()];
  document.getElementById("dateD2").textContent = `${toBn(d.getDate())} ${MONTHS[d.getMonth()]}, ${toBn(d.getFullYear())}`;
  try{
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(d);
    document.getElementById("dateD3").textContent = hijri + " هـ";
  }catch(e){
    document.getElementById("dateD3").textContent = "";
  }
}

function allItemsFlat(){
  let out=[];
  for(const key of tabOrder()){
    for(const cat of DATA[key].categories) out = out.concat(cat.items);
  }
  return out;
}

function renderRing(){
  // progress = current tab's items checked ratio
  const cats = DATA[currentTab].categories;
  let total=0, done=0;
  for(const cat of cats){ for(const it of cat.items){ total++; if(dayState.checked[it.id]) done++; } }
  const pct = total? Math.round((done/total)*100) : 0;
  const circumference = 138.2;
  const offset = circumference - (pct/100)*circumference;
  document.getElementById("ringFg").style.strokeDashoffset = offset;
  document.getElementById("ringPct").textContent = toBn(pct)+"%";
}

function renderTabs(){
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  for(const key of tabOrder()){
    const cats = DATA[key].categories;
    let total=0, done=0;
    for(const cat of cats){ for(const it of cat.items){ total++; if(dayState.checked[it.id]) done++; } }
    const div = document.createElement("div");
    div.className = "tab" + (key===currentTab ? " active":"");
    div.innerHTML = `${DATA[key].label}<span class="badge">${toBn(done)}/${toBn(total)}</span>`;
    div.onclick = () => { currentTab = key; renderAll(); };
    wrap.appendChild(div);
  }
}

function renderMain(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const cats = DATA[currentTab].categories;
  for(const cat of cats){
    const total = cat.items.length;
    const done = cat.items.filter(it=>dayState.checked[it.id]).length;
    const isOpen = openCats[cat.id] !== undefined ? openCats[cat.id] : (currentTab==="daily");
    openCats[cat.id] = isOpen;

    const catDiv = document.createElement("div");
    catDiv.className = "category" + (isOpen ? " open":"");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<h3>${cat.title}</h3><div class="cat-meta"><span class="cat-count">${toBn(done)}/${toBn(total)}</span><span class="chev">▾</span></div>`;
    head.onclick = ()=>{ openCats[cat.id] = !openCats[cat.id]; renderMain(); };
    catDiv.appendChild(head);

    const body = document.createElement("div");
    body.className = "cat-body";
    const inner = document.createElement("div");
    inner.className = "cat-inner";

    for(const it of cat.items){
      const checked = !!dayState.checked[it.id];
      const row = document.createElement("div");
      row.className = "item" + (checked ? " done":"");

      const chk = document.createElement("div");
      chk.className = "chk" + (checked ? " on":"");
      chk.onclick = ()=>{
      if(navigator.vibrate) navigator.vibrate(12);
        if(dayState.checked[it.id]) delete dayState.checked[it.id];
        else dayState.checked[it.id] = true;
        scheduleSave();
        renderMain(); renderTabs(); renderRing();
      };

      const textWrap = document.createElement("div");
      textWrap.className = "item-text";
      const qDiv = document.createElement("div");
      qDiv.className = "item-q";
      qDiv.textContent = it.q;
      qDiv.onclick = chk.onclick;
      textWrap.appendChild(qDiv);

      if(it.detail){
        const toggle = document.createElement("span");
        toggle.className = "detail-toggle";
        toggle.textContent = "বিস্তারিত দেখুন";
        const detailDiv = document.createElement("div");
        detailDiv.className = "item-detail";
        detailDiv.textContent = it.detail;
        toggle.onclick = (e)=>{
          e.stopPropagation();
          detailDiv.classList.toggle("show");
          toggle.textContent = detailDiv.classList.contains("show") ? "বিস্তারিত লুকান" : "বিস্তারিত দেখুন";
        };
        textWrap.appendChild(toggle);
        textWrap.appendChild(detailDiv);
      }

      row.appendChild(chk);
      row.appendChild(textWrap);
      inner.appendChild(row);
    }

    body.appendChild(inner);
    catDiv.appendChild(body);
    main.appendChild(catDiv);
  }

  // notes box
  const notesBox = document.createElement("div");
  notesBox.className = "notes-box";
  notesBox.innerHTML = `<h3>দিনের নোট</h3>`;
  const ta = document.createElement("textarea");
  ta.placeholder = "আজকের বিশেষ কোনো অনুভূতি, দুর্বলতা বা লক্ষ্য লিখে রাখুন…";
  ta.value = dayState.note || "";
  ta.oninput = ()=>{ dayState.note = ta.value; scheduleSave(); };
  notesBox.appendChild(ta);
  main.appendChild(notesBox);
}
function renderStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const raw = localStorage.getItem(keyFor(d));
    if(!raw) break;
    try{
      const val = JSON.parse(raw);
      const hasAny = val.checked && Object.keys(val.checked).length > 0;
      if(!hasAny) break;
    }catch(e){ break; }
    streak++;
    d.setDate(d.getDate()-1);
  }
  const el = document.getElementById("streakText");
  if(el) el.textContent = streak > 0 ? `🔥 ${toBn(streak)} দিনের ধারাবাহিকতা` : "দৈনিক আমলের হিসাব";
}

function renderAll(){
  renderStreak();
  renderDateBar();
  renderTabs();
  renderMain();
  renderRing();
}

async function goToDate(d){
  currentDate = d;
  await loadDay(currentDate);
  renderAll();
}

document.getElementById("prevDay").onclick = ()=>{
  const d = new Date(currentDate); d.setDate(d.getDate()-1); goToDate(d);
};
document.getElementById("nextDay").onclick = ()=>{
  const d = new Date(currentDate); d.setDate(d.getDate()+1); goToDate(d);
};
document.getElementById("todayBtn").onclick = ()=>{ goToDate(new Date()); };
document.getElementById("expandAll").onclick = ()=>{
const darkBtn = document.getElementById("darkBtn");
if(localStorage.getItem("muhasaba-dark")==="1") document.body.classList.add("dark");
darkBtn.onclick = ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("muhasaba-dark", document.body.classList.contains("dark") ? "1":"0");
};
  const cats = DATA[currentTab].categories;
  const anyClosed = cats.some(c => !openCats[c.id]);
  cats.forEach(c => openCats[c.id] = anyClosed);
  renderMain();
};

// init
(async ()=>{
  await goToDate(new Date());
})();
  function getAllStoredDays(){
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith("muhasaba:")){
      try{
        const val = JSON.parse(localStorage.getItem(k));
        out.push({ date: k.replace("muhasaba:",""), checked: val.checked || {} });
      }catch(e){}
    }
  }
  return out;
}

function buildReport(days){
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const all = getAllStoredDays().filter(d => new Date(d.date) >= cutoff);

  const allItems = allItemsFlat();
  let totalPossible = 0, totalDone = 0;
  const catStats = {};

  for(const key of tabOrder()){
    for(const cat of DATA[key].categories){
      catStats[cat.id] = { title: cat.title, done:0, possible:0 };
    }
  }

  for(const day of all){
    for(const key of tabOrder()){
      for(const cat of DATA[key].categories){
        for(const it of cat.items){
          catStats[cat.id].possible++;
          totalPossible++;
          if(day.checked[it.id]){
            catStats[cat.id].done++;
            totalDone++;
          }
        }
      }
    }
  }

  const overallPct = totalPossible ? Math.round((totalDone/totalPossible)*100) : 0;
  const catList = Object.values(catStats)
    .map(c => ({...c, pct: c.possible ? Math.round((c.done/c.possible)*100) : 0}))
    .sort((a,b)=> a.pct - b.pct);

  const content = document.getElementById("reportContent");
  content.innerHTML = `
    <div class="report-summary">
      <div class="big">${toBn(overallPct)}%</div>
      <div class="small">${toBn(all.length)} দিনের এন্ট্রি পাওয়া গেছে (গড় সম্পন্নতা)</div>
    </div>
    <div>
      ${catList.map(c => `
        <div class="report-cat-row">
          <div class="name">${c.title}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${c.pct}%"></div></div>
          <div class="pct">${toBn(c.pct)}%</div>
        </div>
      `).join("")}
    </div>
  `;
}

document.getElementById("reportBtn").onclick = ()=>{
  document.getElementById("reportModal").classList.add("show");
  document.querySelectorAll(".range-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector('.range-btn[data-days="30"]').classList.add("active");
  buildReport(30);
};
document.getElementById("closeReport").onclick = ()=>{
  document.getElementById("reportModal").classList.remove("show");
};
document.querySelectorAll(".range-btn").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".range-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    buildReport(parseInt(btn.dataset.days));
  };
});
document.getElementById("exportBtn").onclick = ()=>{
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith("muhasaba:")) data[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `muhasaba-backup-${fmtDate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
